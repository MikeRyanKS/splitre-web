<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A CDA directs the title company to pay the outside referral first, send the balance to the brokerage, and the brokerage then pays the agent and keeps the rest" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="630" fill="#f9fafb"/>
  <text x="600" y="68" font-size="38" font-weight="700" fill="#111827" text-anchor="middle">What the CDA tells the closing table to do</text>
  <rect x="190" y="110" width="820" height="76" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
  <text x="600" y="158" font-size="32" fill="#111827" text-anchor="middle">Commission held at closing: $13,500</text>
  <line x1="600" y1="186" x2="600" y2="214" stroke="#4338ca" stroke-width="4"/>
  <rect x="190" y="216" width="820" height="76" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="3"/>
  <text x="600" y="264" font-size="32" fill="#374151" text-anchor="middle">Outside referral paid out first: $3,375</text>
  <line x1="600" y1="292" x2="600" y2="320" stroke="#4338ca" stroke-width="4"/>
  <rect x="190" y="322" width="820" height="76" rx="8" fill="#4f46e5"/>
  <text x="600" y="370" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">Balance to the brokerage: $10,125</text>
  <line x1="600" y1="398" x2="600" y2="416" stroke="#4338ca" stroke-width="4"/>
  <line x1="340" y1="416" x2="860" y2="416" stroke="#4338ca" stroke-width="4"/>
  <line x1="340" y1="416" x2="340" y2="444" stroke="#4338ca" stroke-width="4"/>
  <line x1="860" y1="416" x2="860" y2="444" stroke="#4338ca" stroke-width="4"/>
  <rect x="100" y="446" width="480" height="76" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
  <text x="340" y="494" font-size="30" fill="#065f46" text-anchor="middle">Agent net: $5,975.50</text>
  <rect x="620" y="446" width="480" height="76" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="860" y="494" font-size="30" fill="#4338ca" text-anchor="middle">Brokerage keeps: $3,339.50</text>
  <text x="600" y="578" font-size="27" fill="#374151" text-anchor="middle">The bottom row is the brokerage's own split, not the title company's job.</text>
</svg>
