<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Bar chart of what a brokerage collects from a one-deal agent and a twelve-deal agent under a capped split and under a desk fee plan" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="630" fill="#f9fafb"/>
  <text x="60" y="70" font-size="36" font-weight="700" fill="#111827">What the brokerage collects in a year</text>
  <text x="60" y="170" font-size="28" fill="#374151">1 deal a year, capped split: $2,700</text>
  <rect x="60" y="185" width="105" height="40" rx="6" fill="#4f46e5"/>
  <text x="60" y="280" font-size="28" fill="#374151">1 deal a year, desk fee plan: $5,700</text>
  <rect x="60" y="295" width="222" height="40" rx="6" fill="#7c3aed"/>
  <text x="60" y="390" font-size="28" fill="#374151">12 deals a year, capped split: $18,000</text>
  <rect x="60" y="405" width="700" height="40" rx="6" fill="#4f46e5"/>
  <text x="60" y="500" font-size="28" fill="#374151">12 deals a year, desk fee plan: $15,600</text>
  <rect x="60" y="515" width="607" height="40" rx="6" fill="#7c3aed"/>
</svg>
