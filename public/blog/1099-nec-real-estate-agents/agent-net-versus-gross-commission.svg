<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="One agent's year broken into five bars: $84,000 of gross commission, a $25,200 brokerage split, a $58,800 agent share, $3,270 of fees withheld, and $55,530 reported in box 1a" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="630" fill="#f9fafb"/>
  <text x="60" y="68" font-size="36" font-weight="700" fill="#111827">One agent's year, and the 1099 figure</text>
  <rect x="60" y="106" width="1080" height="84" rx="8" fill="#7c3aed"/>
  <text x="92" y="157" font-size="30" fill="#ffffff">Gross commission on her deals: $84,000</text>
  <rect x="60" y="206" width="1080" height="84" rx="8" fill="#4338ca"/>
  <text x="92" y="257" font-size="30" fill="#ffffff">Brokerage split at 70/30: $25,200</text>
  <rect x="60" y="306" width="1080" height="84" rx="8" fill="#4f46e5"/>
  <text x="92" y="357" font-size="30" fill="#ffffff">Her share of the commission: $58,800</text>
  <rect x="60" y="406" width="1080" height="84" rx="8" fill="#eef2ff" stroke="#e5e7eb"/>
  <text x="92" y="457" font-size="30" fill="#374151">Fees withheld from her share: $3,270</text>
  <rect x="60" y="506" width="1080" height="84" rx="8" fill="#10b981"/>
  <text x="92" y="557" font-size="30" font-weight="700" fill="#ffffff">Paid to her, box 1a: $55,530</text>
</svg>
