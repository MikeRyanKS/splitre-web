<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A $12,600 commission with a 70/30 split and a 25 percent team lead override. Off the member's share the brokerage keeps $3,780 and the lead earns $2,205. Off the full commission the brokerage keeps $2,835 and the lead earns $3,150. The member takes home $6,615 either way." font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="630" fill="#f9fafb"/>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#111827">A $12,600 commission, 70/30, with a 25% lead override</text>
  <rect x="60" y="106" width="510" height="84" rx="8" fill="#4338ca"/>
  <text x="92" y="157" font-size="30" font-weight="700" fill="#ffffff">Override off the member's share</text>
  <rect x="630" y="106" width="510" height="84" rx="8" fill="#4f46e5"/>
  <text x="662" y="157" font-size="30" font-weight="700" fill="#ffffff">Override off the full commission</text>
  <rect x="60" y="214" width="510" height="84" rx="8" fill="#eef2ff" stroke="#e5e7eb"/>
  <text x="92" y="265" font-size="30" fill="#374151">Brokerage keeps $3,780</text>
  <rect x="630" y="214" width="510" height="84" rx="8" fill="#eef2ff" stroke="#e5e7eb"/>
  <text x="662" y="265" font-size="30" fill="#374151">Brokerage keeps $2,835</text>
  <rect x="60" y="322" width="510" height="84" rx="8" fill="#eef2ff" stroke="#e5e7eb"/>
  <text x="92" y="373" font-size="30" fill="#374151">Team lead earns $2,205</text>
  <rect x="630" y="322" width="510" height="84" rx="8" fill="#eef2ff" stroke="#e5e7eb"/>
  <text x="662" y="373" font-size="30" fill="#374151">Team lead earns $3,150</text>
  <rect x="60" y="430" width="1080" height="84" rx="8" fill="#10b981"/>
  <text x="92" y="481" font-size="30" font-weight="700" fill="#ffffff">The member takes home $6,615 either way</text>
  <text x="60" y="570" font-size="28" fill="#374151">The setting moves money between the lead and the brokerage, not the member.</text>
</svg>
