<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="An $8,750 commission where the agent has only $2,100 of cap room left. The 30 percent split would have been $2,625, the brokerage collects $2,100 instead, agent fees take $545, and the agent nets $6,105." font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="630" fill="#f9fafb"/>
  <text x="60" y="62" font-size="36" font-weight="700" fill="#111827">Why her check was bigger than her split</text>
  <rect x="60" y="98" width="1080" height="78" rx="8" fill="#4338ca"/>
  <text x="92" y="146" font-size="30" font-weight="700" fill="#ffffff">Gross commission $8,750</text>
  <rect x="60" y="196" width="1080" height="78" rx="8" fill="#eef2ff" stroke="#e5e7eb"/>
  <text x="92" y="244" font-size="30" fill="#374151">A 30% split would have been $2,625</text>
  <rect x="60" y="294" width="1080" height="78" rx="8" fill="#7c3aed"/>
  <text x="92" y="342" font-size="30" font-weight="700" fill="#ffffff">Only $2,100 of cap room was left, so that is all the brokerage took</text>
  <rect x="60" y="392" width="1080" height="78" rx="8" fill="#eef2ff" stroke="#e5e7eb"/>
  <text x="92" y="440" font-size="30" fill="#374151">Her own fees took $545</text>
  <rect x="60" y="490" width="1080" height="78" rx="8" fill="#10b981"/>
  <text x="92" y="538" font-size="30" font-weight="700" fill="#ffffff">Agent net $6,105</text>
</svg>
