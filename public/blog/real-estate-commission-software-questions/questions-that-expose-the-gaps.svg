<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A demo test deal: an agent who has paid $16,500 of an $18,000 cap closes a $15,000 deal on a 70/30 split, so the wrong answer is a $4,500 broker cut and the right answer is $1,500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="630" fill="#f9fafb"/>
  <text x="60" y="80" font-size="36" font-weight="700" fill="#111827">One test deal to run in any demo</text>
  <rect x="60" y="130" width="1080" height="86" rx="8" fill="#eef2ff" stroke="#e5e7eb"/>
  <text x="90" y="183" font-size="30" fill="#111827">Agent has paid $16,500 of an $18,000 cap</text>
  <rect x="60" y="232" width="1080" height="86" rx="8" fill="#eef2ff" stroke="#e5e7eb"/>
  <text x="90" y="285" font-size="30" fill="#111827">Next deal: $15,000 commission, 70/30 split</text>
  <rect x="60" y="356" width="520" height="190" rx="8" fill="#e5e7eb"/>
  <text x="90" y="430" font-size="30" font-weight="700" fill="#111827">Wrong answer</text>
  <text x="90" y="480" font-size="30" fill="#374151">Brokerage keeps $4,500</text>
  <rect x="620" y="356" width="520" height="190" rx="8" fill="#10b981"/>
  <text x="650" y="430" font-size="30" font-weight="700" fill="#ffffff">Right answer</text>
  <text x="650" y="480" font-size="30" fill="#ffffff">Brokerage keeps $1,500</text>
</svg>
