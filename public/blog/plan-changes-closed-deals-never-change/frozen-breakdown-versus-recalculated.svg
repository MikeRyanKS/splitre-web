<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Two ways software remembers a closed deal: a stored result keeps January at $15,600 after a July plan edit, while a stored reference to the plan rewrites January to $10,400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="630" fill="#f9fafb"/>
  <text x="60" y="68" font-size="36" font-weight="700" fill="#111827">In July you raise the split to 80/20</text>
  <rect x="60" y="112" width="510" height="88" rx="8" fill="#10b981"/>
  <text x="92" y="166" font-size="30" font-weight="700" fill="#ffffff">It stored the result</text>
  <rect x="630" y="112" width="510" height="88" rx="8" fill="#4338ca"/>
  <text x="662" y="166" font-size="30" font-weight="700" fill="#ffffff">It stored a link to the plan</text>
  <rect x="60" y="226" width="510" height="152" rx="8" fill="#eef2ff" stroke="#e5e7eb"/>
  <text x="92" y="282" font-size="28" fill="#374151">January still reads</text>
  <text x="92" y="330" font-size="34" font-weight="700" fill="#111827">$15,600 collected</text>
  <rect x="630" y="226" width="510" height="152" rx="8" fill="#eef2ff" stroke="#e5e7eb"/>
  <text x="662" y="282" font-size="28" fill="#374151">January now reads</text>
  <text x="662" y="330" font-size="34" font-weight="700" fill="#111827">$10,400 collected</text>
  <text x="60" y="470" font-size="28" fill="#374151">She was already paid against the first number. Only one of these still agrees with it.</text>
</svg>
