<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A 15,000 dollar gross commission split 70 to 30 into a 4,500 dollar broker cut and a 10,500 dollar agent share, with a flat 150 dollar E and O fee leaving 10,350 dollars and a 2 percent fee of 210 dollars leaving 10,290 dollars" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="630" fill="#f9fafb"/>
  <text x="60" y="74" font-size="36" font-weight="700" fill="#111827">A percentage E and O fee is taken after the split</text>

  <rect x="60" y="112" width="1080" height="80" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="90" y="162" font-size="30" fill="#111827">Gross commission $15,000</text>

  <rect x="60" y="224" width="324" height="80" rx="10" fill="#4f46e5"/>
  <text x="90" y="274" font-size="30" fill="#ffffff">Broker cut 30%: $4,500</text>
  <rect x="408" y="224" width="732" height="80" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="438" y="274" font-size="30" fill="#111827">Agent share 70%: $10,500</text>

  <rect x="408" y="356" width="356" height="180" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="438" y="408" font-size="28" fill="#374151">Flat fee: $150</text>
  <text x="438" y="470" font-size="28" font-weight="700" fill="#10b981">Agent nets $10,350</text>

  <rect x="788" y="356" width="352" height="180" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="818" y="408" font-size="28" fill="#374151">2% of the share: $210</text>
  <text x="818" y="470" font-size="28" font-weight="700" fill="#10b981">Agent nets $10,290</text>
</svg>
