<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A $9,000 commission two ways. As a 20 percent mentor fee on the mentee's plan the brokerage keeps $4,500, the mentor gets $900 and the mentee keeps $3,600. As a co-agent deal with a 25 percent share to the mentor the brokerage keeps $3,825, the mentor keeps $1,800 and the mentee keeps $3,375." font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="630" fill="#f9fafb"/>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#111827">One $9,000 commission, two ways to pay the mentor</text>
  <rect x="60" y="106" width="510" height="84" rx="8" fill="#4338ca"/>
  <text x="92" y="146" font-size="28" font-weight="700" fill="#ffffff">A 20% mentor fee on the</text>
  <text x="92" y="178" font-size="28" font-weight="700" fill="#ffffff">mentee's plan</text>
  <rect x="630" y="106" width="510" height="84" rx="8" fill="#4f46e5"/>
  <text x="662" y="146" font-size="28" font-weight="700" fill="#ffffff">A co-agent deal, 25% of</text>
  <text x="662" y="178" font-size="28" font-weight="700" fill="#ffffff">the commission to the mentor</text>
  <rect x="60" y="214" width="510" height="84" rx="8" fill="#eef2ff" stroke="#e5e7eb"/>
  <text x="92" y="265" font-size="30" fill="#374151">Brokerage keeps $4,500</text>
  <rect x="630" y="214" width="510" height="84" rx="8" fill="#eef2ff" stroke="#e5e7eb"/>
  <text x="662" y="265" font-size="30" fill="#374151">Brokerage keeps $3,825</text>
  <rect x="60" y="322" width="510" height="84" rx="8" fill="#eef2ff" stroke="#e5e7eb"/>
  <text x="92" y="373" font-size="30" fill="#374151">Mentor gets $900</text>
  <rect x="630" y="322" width="510" height="84" rx="8" fill="#eef2ff" stroke="#e5e7eb"/>
  <text x="662" y="373" font-size="30" fill="#374151">Mentor keeps $1,800</text>
  <rect x="60" y="430" width="510" height="84" rx="8" fill="#10b981"/>
  <text x="92" y="481" font-size="30" font-weight="700" fill="#ffffff">Mentee keeps $3,600</text>
  <rect x="630" y="430" width="510" height="84" rx="8" fill="#10b981"/>
  <text x="662" y="481" font-size="30" font-weight="700" fill="#ffffff">Mentee keeps $3,375</text>
  <text x="60" y="570" font-size="28" fill="#374151">Figures before each agent's own per-deal fees.</text>
</svg>
