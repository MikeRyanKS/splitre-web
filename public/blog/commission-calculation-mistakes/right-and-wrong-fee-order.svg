<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A 6 percent royalty taken off the 13,500 dollar gross commission before a 70 to 30 split leaves the agent 8,883 dollars, while taking the same royalty after the split leaves 8,640 dollars, a difference of 243 dollars" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="630" fill="#f9fafb"/>
  <text x="60" y="72" font-size="36" font-weight="700" fill="#111827">Same fee, same deal, two answers</text>

  <rect x="60" y="112" width="520" height="364" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
  <text x="92" y="168" font-size="30" font-weight="700" fill="#111827">Royalty off the gross</text>
  <text x="92" y="236" font-size="28" fill="#374151">Gross $13,500</text>
  <text x="92" y="292" font-size="28" fill="#374151">Royalty 6%: minus $810</text>
  <text x="92" y="348" font-size="28" fill="#374151">Split 30% of $12,690</text>
  <text x="92" y="428" font-size="32" font-weight="700" fill="#10b981">Agent gets $8,883</text>

  <rect x="620" y="112" width="520" height="364" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="3"/>
  <text x="652" y="168" font-size="30" font-weight="700" fill="#111827">Royalty after the split</text>
  <text x="652" y="236" font-size="28" fill="#374151">Gross $13,500</text>
  <text x="652" y="292" font-size="28" fill="#374151">Split 30% of $13,500</text>
  <text x="652" y="348" font-size="28" fill="#374151">Royalty 6%: minus $810</text>
  <text x="652" y="428" font-size="32" font-weight="700" fill="#374151">Agent gets $8,640</text>

  <text x="60" y="552" font-size="30" font-weight="600" fill="#4f46e5">One wrong formula moves $243 on a single deal</text>
</svg>
