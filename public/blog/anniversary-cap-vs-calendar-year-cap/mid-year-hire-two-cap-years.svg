<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Timeline comparing a June hire under a calendar-year cap, which resets in January, with an anniversary cap that runs twelve months" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="630" fill="#f9fafb"/>
  <text x="60" y="70" font-size="36" font-weight="700" fill="#111827">Same agent, first 12 months</text>
  <text x="60" y="190" font-size="30" font-weight="700" fill="#111827">Calendar cap: brokerage collects $22,000</text>
  <rect x="60" y="215" width="630" height="90" rx="8" fill="#4f46e5"/>
  <rect x="696" y="215" width="444" height="90" rx="8" fill="#7c3aed"/>
  <text x="80" y="272" font-size="28" fill="#ffffff">Jun to Dec: capped at $12,000</text>
  <text x="716" y="272" font-size="28" fill="#ffffff">Jan to May: $10,000</text>
  <text x="60" y="410" font-size="30" font-weight="700" fill="#111827">Anniversary cap: brokerage collects $12,000</text>
  <rect x="60" y="435" width="1080" height="90" rx="8" fill="#10b981"/>
  <text x="80" y="492" font-size="28" fill="#ffffff">One cap year, capped in November, 100% until May</text>
</svg>
